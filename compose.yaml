services:
  grimoire:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      GRIMOIRE_DATABASE: /app/data/grimoire.sqlite
      GRIMOIRE_PAGES_DIRECTORY: /app/data/cards
      # Read from .env beside this file, and blank when it says nothing, so an instance behind
      # a proxy can be told so without editing the Compose file. See docs/self-hosting.md.
      GRIMOIRE_TRUST_PROXY: ${GRIMOIRE_TRUST_PROXY:-}
      GRIMOIRE_OIDC_ISSUER: ${GRIMOIRE_OIDC_ISSUER:-}
      GRIMOIRE_OIDC_CLIENT_ID: ${GRIMOIRE_OIDC_CLIENT_ID:-}
      GRIMOIRE_OIDC_CLIENT_SECRET: ${GRIMOIRE_OIDC_CLIENT_SECRET:-}
      GRIMOIRE_OIDC_LABEL: ${GRIMOIRE_OIDC_LABEL:-}
      GRIMOIRE_OIDC_REDIRECT_URI: ${GRIMOIRE_OIDC_REDIRECT_URI:-}
      GRIMOIRE_OIDC_SCOPES: ${GRIMOIRE_OIDC_SCOPES:-}
      GRIMOIRE_OIDC_AUTO_REGISTER: ${GRIMOIRE_OIDC_AUTO_REGISTER:-}
      GRIMOIRE_OIDC_ALLOWED_EMAIL_DOMAINS: ${GRIMOIRE_OIDC_ALLOWED_EMAIL_DOMAINS:-}
      GRIMOIRE_OIDC_SIGNUP_PROJECT: ${GRIMOIRE_OIDC_SIGNUP_PROJECT:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
