name: Bug report
description: Something Grimoire does is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, please do not file it
        here — report it privately instead, as described in
        [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did Grimoire do, and what did you expect instead?
      placeholder: |
        Dragged a page from Up Next into In progress while a teammate had it open.
        The page landed, but their edit was silently lost. I expected the refused
        overwrite the README promises.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The shortest path that shows the problem, starting from a fresh project if possible.
      placeholder: |
        1. Create a project with two accounts.
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release you run, or the commit if you deploy from main.
      placeholder: v0.6.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: How it is running
      description: Docker Compose, bare Node, behind which proxy or tunnel, and which browser if the bug is in the interface.
      placeholder: compose.yaml behind Caddy, Firefox on desktop
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server output or a screenshot, if either shows the problem. Redact anything private.
