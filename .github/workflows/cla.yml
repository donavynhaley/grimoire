name: CLA

# The agreement has to be recorded before a contribution lands, not after: once
# somebody else's copyright is in the tree unlicensed, every later licensing
# decision needs their permission. See docs/contributor-license-agreement.md.
#
# `pull_request_target` rather than `pull_request` because the check has to write
# a signature file and a status back to the repository, which a fork's read-only
# token cannot do. Nothing here checks out or runs the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check the contributor licence agreement, or record a signature
        # An unrelated comment on an unrelated issue should not wake the action up.
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live on their own branch so recording one never puts a
          # commit on main and never triggers CI, Release, or a deployment. The
          # branch has to exist before the first run, and it is created empty:
          #   git switch --orphan cla-signatures
          #   git commit --allow-empty -m "chore: start the CLA signature branch"
          #   git push -u origin cla-signatures
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/donavynhaley/grimoire/blob/main/docs/contributor-license-agreement.md
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          # The copyright holder is not asked to license work to himself, and a
          # bot has no copyright to grant.
          allowlist: donavynhaley,dependabot[bot],github-actions[bot],renovate[bot]
          # A merged pull request is a conversation people still reply to.
          lock-pullrequest-aftermerge: false
