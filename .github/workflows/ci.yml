name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails fast and by name, so a contributor's first red build says "formatting" rather
      # than burying it in the type-check half of `npm run build`.
      - name: Check formatting and lint
        run: npx biome ci

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Install MCP package dependencies
        run: npm ci
        working-directory: packages/grimoire-mcp

      - name: Verify the MCP package end to end
        run: npm run verify
        working-directory: packages/grimoire-mcp

      - name: Validate production Compose configuration
        env:
          TUNNEL_TOKEN: validation-only
        run: docker compose -f compose.production.yaml config --quiet

      - name: Build production container
        run: docker build -t grimoire-ci .
