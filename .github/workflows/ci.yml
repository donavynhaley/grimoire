name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Validate production Compose configuration
        env:
          TUNNEL_TOKEN: validation-only
        run: docker compose -f compose.production.yaml config --quiet

      - name: Build production container
        run: docker build -t grimoire-ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, grimoire]
    timeout-minutes: 20
    concurrency:
      group: grimoire-production
      cancel-in-progress: false
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v7

      - name: Sync source into the deployment directory
        run: |
          mkdir -p /home/donavynhaley/grimoire/data
          rsync -a --delete \
            --exclude '.git' --exclude '.env' \
            --exclude 'data' --exclude 'dist' --exclude 'server-dist' \
            --exclude 'node_modules' --exclude '.lavish' \
            ./ /home/donavynhaley/grimoire/

      - name: Refresh the Cloudflare connector image
        working-directory: /home/donavynhaley/grimoire
        run: docker compose -f compose.production.yaml pull cloudflared

      - name: Build and restart Grimoire
        working-directory: /home/donavynhaley/grimoire
        run: docker compose -f compose.production.yaml up -d --build --remove-orphans

      - name: Verify container health
        working-directory: /home/donavynhaley/grimoire
        run: |
          for i in $(seq 1 20); do
            if docker compose -f compose.production.yaml exec -T grimoire node -e 'fetch("http://127.0.0.1:8080/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then
              echo "grimoire is healthy"
              exit 0
            fi
            echo "waiting for grimoire ($i/20)"
            sleep 4
          done
          echo "::error::grimoire did not become healthy after deployment"
          docker compose -f compose.production.yaml logs --tail=100 grimoire cloudflared
          exit 1

      - name: Reclaim dangling image space
        if: always()
        run: docker image prune -f
