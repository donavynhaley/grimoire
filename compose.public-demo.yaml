# Separate from production: never mount real data or attach this network to production.
services:
  grimoire-demo:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      GRIMOIRE_DATABASE: /app/data/grimoire.sqlite
      GRIMOIRE_PAGES_DIRECTORY: /app/data/pages
    volumes:
      - public-demo-data:/app/data
    networks: [demo]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  gateway:
    build: .
    command: [node, scripts/demo-gateway.mjs]
    restart: unless-stopped
    environment:
      DEMO_UPSTREAM: http://grimoire-demo:8080
    ports:
      - "127.0.0.1:${GRIMOIRE_DEMO_PORT:-8098}:8080"
    depends_on:
      grimoire-demo:
        condition: service_healthy
    networks: [demo]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
networks:
  demo:
    internal: true
volumes:
  public-demo-data:
