name: grimoire

services:
  grimoire:
    build:
      context: .
      dockerfile: Dockerfile
    image: grimoire-web:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      GRIMOIRE_DATABASE: /app/data/grimoire.sqlite
      GRIMOIRE_PAGES_DIRECTORY: /app/data/cards
      # The tunnel is the only thing that reaches this container, and it forwards the visitor's
      # address. Without this every sign-in would be counted against the tunnel itself.
      GRIMOIRE_TRUST_PROXY: "1"
      # Blank unless set in .env, which is how an installation running on passwords alone
      # starts with no provider rather than with a broken one.
      GRIMOIRE_OIDC_ISSUER: ${GRIMOIRE_OIDC_ISSUER:-}
      GRIMOIRE_OIDC_CLIENT_ID: ${GRIMOIRE_OIDC_CLIENT_ID:-}
      GRIMOIRE_OIDC_CLIENT_SECRET: ${GRIMOIRE_OIDC_CLIENT_SECRET:-}
      GRIMOIRE_OIDC_LABEL: ${GRIMOIRE_OIDC_LABEL:-}
      GRIMOIRE_OIDC_REDIRECT_URI: ${GRIMOIRE_OIDC_REDIRECT_URI:-}
      GRIMOIRE_OIDC_SCOPES: ${GRIMOIRE_OIDC_SCOPES:-}
      GRIMOIRE_OIDC_SIGNUP: ${GRIMOIRE_OIDC_SIGNUP:-}
      GRIMOIRE_OIDC_SIGNUP_PROJECT: ${GRIMOIRE_OIDC_SIGNUP_PROJECT:-}
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      grimoire:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
